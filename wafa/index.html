<body>
<main class="lk"><div class="lk-card card">
  <img class="lk-ic" src="icons/icon-192.png" alt="">
  <span class="lk-lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>منصة خاصة</span>
  <h1>منصة وفاء</h1>
  <p class="lk-sub">أدخلي كلمة المرور لفتح المنصة على هذا الجهاز. تُحفظ على الجهاز فلا تُطلب مرة أخرى.</p>
  <form id="lkForm" autocomplete="on">
    <div class="lk-row"><input id="lkPw" class="input" type="password" autocomplete="current-password" placeholder="كلمة المرور" dir="ltr" required><button type="button" class="lk-eye" id="lkEye" aria-label="إظهار كلمة المرور"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
    <button id="lkBtn" class="btn block" type="submit">فتح المنصة</button>
    <p id="lkMsg" class="lk-msg" role="status"></p>
  </form>
  <p class="lk-foot">محتوى المنصة مشفّر، ولا يمكن قراءته دون كلمة المرور.</p>
</div></main>
